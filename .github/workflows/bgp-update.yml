name: BGP Data Update

on:
  schedule:
    - cron: '10 16 * * *'  # 每天北京时间午夜10分（UTC 16:10）运行
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.0'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        sudo apt-get update && sudo apt-get install -y bgpdump jq  # 安装 bgpdump 用于解析 MRT 数据  安装 jq 用于处理 JSON 数据

    - name: Download and process BGP data
      run: |
        python download_bgp.py --keep --skip-mrt
        ls -la bgp_data/

    - name: 解码 AS Routes
      run: |
        # 使用 bgpdump -m 输出为 MRT 格式
        mv bgp_data/*.bz2 ./
        FILE=$(ls *.bz2 | head -n 1)
        OUTPUT_FILE="bgp_data/bgp_data.txt"

        echo "正在解码文件: $FILE"
        bunzip2 -c "$FILE" | bgpdump -m - > "$OUTPUT_FILE"

        echo "提取结果预览："
        head -n 20 bgp_data/bgp_data.txt
        echo "---"
        echo "总共提取到 $(wc -l < bgp_data/bgp_data.txt) 条路由"

    # - name: 过滤 AS prefixes
    #   run: |
    #     # 找到最新的BGP数据文件
    #     LATEST_FILE=$(ls -t bgp_data/*.txt | head -1)
    #     if [ -n "$LATEST_FILE" ]; then
    #       echo "Processing file: $LATEST_FILE"
    #       python extract_as_prefixes.py "$LATEST_FILE" -A as_target.txt
    #     else
    #       echo "No BGP data file found"
    #       exit 1
    #     fi
    #     ls -la as_prefixes/
    - name: 提取全部 AS prefixes
      run: |
        # 找到最新的BGP数据文件
        LATEST_FILE=$(ls -t bgp_data/*.txt | head -1)
        if [ -n "$LATEST_FILE" ]; then
          echo "Processing file: $LATEST_FILE"
          python extract_as_prefixes.py "$LATEST_FILE"
        else
          echo "No BGP data file found"
          exit 1
        fi
        ls -la as_prefixes/

    - name: 生成汇总文件
      run: |
        echo "# BGP Data Update Summary" > README.md
        echo "" >> README.md
        echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
        echo "" >> README.md
        echo "## Generated Files" >> README.md
        echo "" >> README.md
        echo "### BGP Data Files" >> README.md
        ls -la bgp_data/ | grep -E '\.(bz2|gz|txt)$' | while read line; do
          echo "- $line" >> README.md
        done
        echo "" >> README.md
        echo "### AS Prefix Files" >> README.md
        ls -la as_prefixes/ | while read line; do
          echo "- $line" >> README.md
        done
        echo "" >> README.md
        echo "This file is automatically generated by GitHub Actions." >> README.md
        mv README.md as_prefixes/README.md

    - name: 生成 all_as_prefixes.txt
      run: |
        echo "Combining all AS prefix files..."
        mkdir -p as_prefixes
        cat $(ls -v as_prefixes/*.txt 2>/dev/null) > as_prefixes/all_as_prefixes.txt || true
        wc -l as_prefixes/all_as_prefixes.txt

    - name: 准备 Release 资产
      run: |
        mkdir -p release-package/as_prefixes
        cp as_prefixes/*.txt release-package/as_prefixes/ || true
        ls -lh release-package/as_prefixes

    - name: Upload Data Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-bgp-data
        path: |
          release-package/as_prefixes
        retention-days: 1

  publish-release:
    needs: generate-data
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Data Artifact
      uses: actions/download-artifact@v4
      with:
        name: my-bgp-data
        path: ./release-package

    - name: Publish GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: bgp-data-${{ github.run_number }}
        name: BGP Data Update ${{ github.run_number }}
        body: |
          自动生成的 BGP 数据和 AS 前缀文件。
          生成来源: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          Release tag: bgp-data-${{ github.run_number }}
        draft: false
        prerelease: false
        assets: |
          release-package/as_prefixes/*.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release info
      run: |
        echo "发布完成，资产文件："
        ls -lh release-package
        echo "注意: Release 资产单文件最大 2GB。"
        echo "若需要只保留最新版本，建议定期清理旧 Release 或使用固定 tag 进行更新。"
